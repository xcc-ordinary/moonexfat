name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: MoonBit check & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update registry
        run: moon update

      - name: Check (wasm)
        run: moon check --target wasm

      - name: Build (wasm)
        run: moon build --target wasm

      - name: Build (wasm-gc)
        run: moon build --target wasm-gc

      - name: Test (wasm, full suite)
        run: moon test --target wasm

      - name: Test (wasm-gc, pure logic)
        run: moon test --target wasm-gc

      - name: CLI smoke test
        run: |
          moon run cmd/moonexfat --target wasm -- inspect testdata/synthetic.exfat
          moon run cmd/moonexfat --target wasm -- inspect testdata/mini.exfat
          moon run cmd/moonexfat --target wasm -- chain testdata/mini.exfat 6
          moon run cmd/moonexfat --target wasm -- ls testdata/mini.exfat
          moon run cmd/moonexfat --target wasm -- cat testdata/mini.exfat SUB/NESTED.TXT
          moon run cmd/moonexfat --target wasm -- extract testdata/mini.exfat DATA.BIN /tmp/data.bin
          test "$(stat -c%s /tmp/data.bin)" = "1200"
          moon run cmd/moonexfat --target wasm -- tree testdata/mini.exfat
          moon run cmd/moonexfat --target wasm -- verify testdata/mini.exfat
          moon run cmd/moonexfat --target wasm -- stat testdata/mini.exfat HELLO.TXT
          moon run cmd/moonexfat --target wasm -- map testdata/mini.exfat DATA.BIN
          moon run cmd/moonexfat --target wasm -- find testdata/mini.exfat nested
          moon run cmd/moonexfat --target wasm -- deleted testdata/mini.exfat
          moon run examples/basic --target wasm

  cross-validate:
    name: Real-image cross-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update registry
        run: moon update

      - name: Cross-validate against real mkfs.exfat image (18 files)
        run: bash scripts/cross-validate.sh